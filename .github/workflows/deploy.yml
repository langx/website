name: Deploy to Cloudflare Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # The word and example-sentence readings behind every speaker button
      # outside /tools/say (static/audio/w and x) — some four hundred
      # megabytes of MP3 that are kept out of git and
      # published as a release asset instead; see
      # scripts/wordlists/build-word-audio.py and word-audio.sh. The tag is
      # pinned here, so a new set of readings goes live by changing this line
      # and not before. A failed download fails the deploy: without the files
      # every button would quietly disappear.
      - name: Unpack word audio
        env:
          GH_TOKEN: ${{ github.token }}
          WORD_AUDIO_RELEASE: word-audio-2026-09-23d
        run: |
          set -o pipefail
          mkdir -p static/audio
          gh release download "$WORD_AUDIO_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern word-audio.tar --output - | tar -x -C static/audio
          test -f static/audio/w/en/index.json
          test -f static/audio/x/en/index.json

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          # A repository *variable*, not a secret, and deliberately so: Vite
          # inlines this into the bundle every visitor downloads, so calling it
          # a secret would only be theatre. A PostHog project API key can write
          # events and never read them, and this is literally the app's
          # EXPO_PUBLIC_POSTHOG_KEY — one project, because the free plan allows
          # one. Unset, the SDK is never loaded and the site sends nothing.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: |
          npm run build

      # Two paths, and the second one is the reason the deploy step below
      # publishes `build` rather than `.`. Wrangler compiles Pages Functions
      # from a `functions/` directory in its *working* directory, not from
      # inside the directory it publishes, and the deploy job never checks the
      # repository out — it only unpacks this artifact. Naming two paths makes
      # upload-artifact keep the workspace as the artifact root, so the deploy
      # job unpacks `build/` and `functions/` side by side exactly as they sit
      # here. With a single `build/` path the artifact root is `build/` itself
      # and the output lands at the top level, which is what `directory: '.'`
      # used to mean.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: |
            build/
            functions/

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: website

      # `cloudflare/pages-action` was archived, then deleted: from 23 Sep 2026
      # every run failed at "Unable to resolve action", and langx.io stayed on
      # the 18 Sep deploy. `wrangler-action` is what its README pointed at. It
      # runs the same `wrangler pages deploy` the old action wrapped, with the
      # same token, project and branch, so the swap is the command spelled out
      # rather than a change in what is published. Wrangler compiles Pages
      # Functions from `functions/` in its working directory — the artifact
      # root, where the upload step above puts it beside `build/`.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=website --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'

      # Pinned to the last tag rather than @master. The repository is archived
      # and has not moved since 2022, so the branch is not going to change
      # under us — but a branch reference is how an unrelated upstream commit
      # gets to run in our deploy, which is worth closing whether or not this
      # particular one is asleep.
      #
      # No PURGE_URLS on purpose. The action's own documentation: "If unset,
      # the action will purge everything (which is suggested)." The explicit
      # list that used to be here never covered the pages that actually change
      # — the 53 word-list pages went out stale after their own deploy — and
      # the "https://langx.io/*" entry at the end of it was a wildcard purge,
      # which Cloudflare only honours on Enterprise, so it silently did
      # nothing. A hand-maintained list of a static site's URLs will always
      # drift; purging the zone cannot.
      - name: Purge cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # After the deploy, tell IndexNow which pages this push changed, so Bing and
  # the other engines that read it recrawl them now rather than whenever they
  # next pass. Informational only: a failure here never fails a deploy that
  # already went out. Google does not use IndexNow; it reads the sitemap.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Submit changed pages
        run: node scripts/indexnow.mjs --changed ${{ github.event.before }} ${{ github.sha }}

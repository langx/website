name: Deploy to Cloudflare Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: website

      # `cloudflare/pages-action` is archived and its README points at
      # `wrangler-action`. Left alone here on purpose: swapping it changes the
      # command, the token scope and the branch handling of the deploy that
      # publishes langx.io, and none of that can be tested anywhere but on
      # main. It is a change of its own, not a version bump.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: website
          directory: '.'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          wranglerVersion: '3'

      # Pinned to the last tag rather than @master. The repository is archived
      # and has not moved since 2022, so the branch is not going to change
      # under us — but a branch reference is how an unrelated upstream commit
      # gets to run in our deploy, which is worth closing whether or not this
      # particular one is asleep.
      # The list is explicit because the "https://langx.io/*" entry below is a
      # wildcard purge, which Cloudflare only honours on Enterprise — on this
      # plan it silently does nothing. robots.txt was served from a fourteen
      # hour old cache after the tools deploy for exactly that reason.
      - name: Purge cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PURGE_URLS: |
            [
              "https://www.langx.io",
              "https://langx.io",
              "https://langx.io/blog",
              "https://langx.io/pro",
              "https://langx.io/welcome-back",
              "https://langx.io/rss.xml",
              "https://langx.io/sitemap.xml",
              "https://langx.io/terms-conditions",
              "https://langx.io/privacy-policy",
              "https://langx.io/cookie-policy",
              "https://langx.io/data-deletion",
              "https://langx.io/robots.txt",
              "https://langx.io/tools",
              "https://langx.io/tools/most-common-words",
              "https://langx.io/*"
            ]

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>LangX — post card</title>
		<!--
			The social card for a blog post, 1200x630. `scripts/og/posts.mjs` opens
			it once per post with the title, eyebrow and kind in the query string
			and screenshots it into static/images/posts/<slug>.png. Same material as
			the site card: white ground, Nunito 800, blue for the eyebrow and one
			yellow slab.
		-->
		<style>
			@font-face {
				font-family: 'Nunito';
				font-weight: 800;
				src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2)
					format('woff2');
			}
			@font-face {
				font-family: 'Nunito';
				font-weight: 700;
				src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2)
					format('woff2');
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #ffffff;
				color: #17191c;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 72px 80px 64px;
				position: relative;
			}
			body::after {
				content: '';
				position: absolute;
				right: 0;
				top: 0;
				width: 24px;
				height: 100%;
				background: #ffc409;
			}
			.eyebrow {
				font-family: 'Nunito', sans-serif;
				font-weight: 800;
				font-size: 30px;
				color: #3b6cf6;
				letter-spacing: 0.01em;
			}
			h1 {
				font-family: 'Nunito', sans-serif;
				font-weight: 800;
				font-size: 76px;
				line-height: 1.04;
				letter-spacing: -0.02em;
				margin: 18px 0 0;
				max-width: 1000px;
			}
			h1.long {
				font-size: 62px;
			}
			h1.longer {
				font-size: 52px;
			}
			.foot {
				display: flex;
				align-items: center;
				justify-content: space-between;
				border-top: 2px solid #e8eaec;
				padding-top: 28px;
				margin-right: 24px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				font-family: 'Nunito', sans-serif;
				font-weight: 800;
				font-size: 36px;
			}
			.brand img {
				width: 48px;
				height: 48px;
			}
			.tag {
				font-weight: 600;
				font-size: 24px;
				color: #62676d;
			}
		</style>
	</head>
	<body>
		<div>
			<div class="eyebrow" id="eyebrow"></div>
			<h1 id="title"></h1>
		</div>
		<div class="foot">
			<div class="brand"><img src="../../src/lib/images/logo.svg" alt="" />LangX</div>
			<div class="tag">langx.io · open source language exchange</div>
		</div>
		<script>
			const q = new URLSearchParams(location.search);
			const title = q.get('title') || '';
			const h1 = document.getElementById('title');
			h1.textContent = title;
			if (title.length > 70) h1.className = 'longer';
			else if (title.length > 48) h1.className = 'long';
			document.getElementById('eyebrow').textContent = q.get('eyebrow') || 'LangX Blog';
		</script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>LangX — Venus card</title>
		<!--
			The social card for /venus, behind `static/images/venus/og.png`, at
			1200x630. The page's own lilac block, the heading in Nunito 900 and
			Venus waving: the same vector render the page opens with.

			Render it with `node scripts/og/render.mjs venus`.
		-->
		<style>
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 900;
				src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2)
					format('woff2');
			}

			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}

			body {
				display: grid;
				grid-template-columns: 1fr 470px;
				align-items: center;
				padding: 0 40px 0 88px;
				background: #bba4ff;
				color: #14161b;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			}

			.tag {
				display: inline-block;
				padding: 8px 18px;
				border-radius: 999px;
				background: #14161b;
				color: #bba4ff;
				font:
					900 22px/1 'Nunito',
					sans-serif;
			}

			h1 {
				margin-top: 28px;
				font:
					900 112px/0.95 'Nunito',
					sans-serif;
				letter-spacing: -0.035em;
			}

			p {
				margin-top: 28px;
				max-width: 520px;
				font-size: 30px;
				line-height: 1.3;
				font-weight: 600;
			}

			.site {
				margin-top: 36px;
				font:
					900 26px/1 'Nunito',
					sans-serif;
			}

			img {
				width: 470px;
				height: 470px;
			}
		</style>
	</head>
	<body>
		<div>
			<span class="tag">The LangX cat</span>
			<h1>meet venus.</h1>
			<p>Tiny cat. Huge ears. Even bigger confidence.</p>
			<p class="site">langx.io/venus</p>
		</div>
		<img src="../../static/images/venus/venus-hi.webp" alt="" />
	</body>
</html>
